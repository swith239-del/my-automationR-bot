<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اتوماسیون سایت</title>
    <style>
        body {
            font-family: 'Tahoma', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #764ba2;
        }
        #status {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            display: none;
        }
        .success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 اتوماسیون سایت</h1>
        <form id="automationForm">
            <div class="form-group">
                <label>فشار (Pressure):</label>
                <input type="number" id="pressure" name="pressure" required>
            </div>
            <div class="form-group">
                <label>دمای (Temperature):</label>
                <input type="number" id="temperature" name="temperature" required>
            </div>
            <div class="form-group">
                <label>توضیح:</label>
                <textarea id="description" name="description" required></textarea>
            </div>
            <div class="form-group">
                <label>تاریخ و ساعت:</label>
                <input type="datetime-local" id="date" name="date" required>
            </div>
            <button type="submit">🚀 اجرا</button>
        </form>
        <div id="status"></div>
    </div>

    <script>
        document.getElementById('automationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const pressure = document.getElementById('pressure').value;
            const temperature = document.getElementById('temperature').value;
            const description = document.getElementById('description').value;
            const date = document.getElementById('date').value;
            
            const statusDiv = document.getElementById('status');
            statusDiv.className = '';
            statusDiv.textContent = '⏳ در حال اجرا...';
            statusDiv.style.display = 'block';
            
            try {
                const response = await fetch('/run', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        pressure,
                        temperature,
                        description,
                        date
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    statusDiv.className = 'success';
                    statusDiv.textContent = '✅ ' + data.message;
                } else {
                    statusDiv.className = 'error';
                    statusDiv.textContent = '❌ ' + data.message;
                }
            } catch (error) {
                statusDiv.className = 'error';
                statusDiv.textContent = '❌ خطا: ' + error.message;
            }
        });
    </script>
</body>
</html>
