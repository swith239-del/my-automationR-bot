<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELOG Submit Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            direction: rtl;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 500px;
            padding: 40px;
        }
        
        .login-form {
            display: block;
        }
        
        .dashboard {
            display: none;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        
        input[type="text"],
        input[type="password"],
        input[type="email"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="email"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .message {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 5px;
            text-align: center;
            display: none;
        }
        
        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        
        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        
        .message.info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }
        
        .logout-btn {
            background-color: #dc3545;
            margin-top: 10px;
        }
        
        .logout-btn:hover {
            box-shadow: 0 5px 20px rgba(220, 53, 69, 0.4);
        }
        
        .user-info {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .user-info p {
            color: #666;
            margin: 5px 0;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #ddd;
        }
        
        .tab-button {
            padding: 10px 20px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            transition: color 0.3s;
            width: auto;
        }
        
        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
        }
        
        .button-group button {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Form -->
        <div class="login-form" id="loginForm">
            <h1>ورود به ELOG</h1>
            <div id="loginMessage" class="message"></div>
            <div class="form-group">
                <label for="username">نام کاربری:</label>
                <input type="text" id="username" placeholder="نام کاربری را وارد کنید">
            </div>
            <div class="form-group">
                <label for="password">رمز عبور:</label>
                <input type="password" id="password" placeholder="رمز عبور را وارد کنید">
            </div>
            <button onclick="login()">ورود</button>
        </div>

        <!-- Dashboard -->
        <div class="dashboard" id="dashboard">
            <h1>داشبورد ELOG</h1>
            <div class="user-info">
                <p>خوش آمدید</p>
                <p><strong id="displayUsername"></strong></p>
            </div>
            
            <div id="dashboardMessage" class="message"></div>

            <div class="tabs">
                <button class="tab-button active" onclick="switchTab('submit')">ارسال دستی</button>
                <button class="tab-button" onclick="switchTab('test')">تست اتصال</button>
                <button class="tab-button" onclick="switchTab('schedule')">زمان‌بندی</button>
            </div>

            <!-- Submit Tab -->
            <div id="submit" class="tab-content active">
                <div class="form-group">
                    <label for="title">عنوان:</label>
                    <input type="text" id="title" placeholder="عنوان را وارد کنید">
                </div>
                <div class="form-group">
                    <label for="description">توضیحات:</label>
                    <textarea id="description" placeholder="توضیحات را وارد کنید"></textarea>
                </div>
                <div class="form-group">
                    <label for="category">دسته‌بندی:</label>
                    <select id="category">
                        <option value="">انتخاب کنید</option>
                        <option value="bug">اشکال</option>
                        <option value="feature">ویژگی</option>
                        <option value="improvement">بهبود</option>
                    </select>
                </div>
                <button onclick="submitData()">ارسال</button>
            </div>

            <!-- Test Connection Tab -->
            <div id="test" class="tab-content">
                <p style="text-align: center; color: #666; margin-bottom: 20px;">تست اتصال به سرور ELOG</p>
                <button onclick="testConnection()">تست اتصال</button>
                <div id="testResult" style="margin-top: 15px; padding: 10px; border-radius: 5px; display: none;"></div>
            </div>

            <!-- Schedule Tab -->
            <div id="schedule" class="tab-content">
                <div class="form-group">
                    <label for="scheduleTitle">عنوان:</label>
                    <input type="text" id="scheduleTitle" placeholder="عنوان را وارد کنید">
                </div>
                <div class="form-group">
                    <label for="scheduleDescription">توضیحات:</label>
                    <textarea id="scheduleDescription" placeholder="توضیحات را وارد کنید"></textarea>
                </div>
                <div class="form-group">
                    <label for="scheduleCategory">دسته‌بندی:</label>
                    <select id="scheduleCategory">
                        <option value="">انتخاب کنید</option>
                        <option value="bug">اشکال</option>
                        <option value="feature">ویژگی</option>
                        <option value="improvement">بهبود</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="scheduleTime">زمان ارسال (ساعت:دقیقه):</label>
                    <input type="text" id="scheduleTime" placeholder="مثال: 14:30">
                </div>
                <div class="button-group">
                    <button onclick="scheduleSubmit()">زمان‌بندی</button>
                    <button onclick="getSchedules()">مشاهده برنامه‌ها</button>
                </div>
                <div id="schedulesList" style="margin-top: 20px;"></div>
            </div>

            <button class="logout-btn" onclick="logout()">خروج</button>
        </div>
    </div>

    <script>
        // Check if user is logged in on page load
        window.addEventListener('load', function() {
            checkLoginStatus();
        });

        function checkLoginStatus() {
            fetch('/check_login')
                .then(response => response.json())
                .then(data => {
                    if (data.logged_in) {
                        showDashboard(data.username);
                    } else {
                        showLogin();
                    }
                })
                .catch(error => console.error('Error:', error));
        }

        function showLogin() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
        }

        function showDashboard(username) {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('displayUsername').textContent = username;
        }

        function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) {
                showMessage('loginMessage', 'لطفاً نام کاربری و رمز عبور را وارد کنید', 'error');
                return;
            }

            fetch('/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    username: username,
                    password: password
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showDashboard(username);
                } else {
                    showMessage('loginMessage', data.message || 'خطا در ورود', 'error');
                }
            })
            .catch(error => {
                showMessage('loginMessage', 'خطای سرور: ' + error.message, 'error');
            });
        }

        function logout() {
            fetch('/logout', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        showLogin();
                        document.getElementById('username').value = '';
                        document.getElementById('password').value = '';
                    }
                })
                .catch(error => console.error('Error:', error));
        }

        function switchTab(tabName) {
            // Hide all tabs
            const tabs = document.querySelectorAll('.tab-content');
            tabs.forEach(tab => tab.classList.remove('active'));

            // Remove active class from all buttons
            const buttons = document.querySelectorAll('.tab-button');
            buttons.forEach(button => button.classList.remove('active'));

            // Show selected tab and highlight button
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        function submitData() {
            const title = document.getElementById('title').value.trim();
            const description = document.getElementById('description').value.trim();
            const category = document.getElementById('category').value;

            if (!title || !description || !category) {
                showMessage('dashboardMessage', 'لطفاً تمام فیلدها را پر کنید', 'error');
                return;
            }

            showMessage('dashboardMessage', 'در حال ارسال...', 'info');

            fetch('/submit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    title: title,
                    description: description,
                    category: category
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showMessage('dashboardMessage', 'درخواست با موفقیت ارسال شد', 'success');
                    document.getElementById('title').value = '';
                    document.getElementById('description').value = '';
                    document.getElementById('category').value = '';
                } else {
                    showMessage('dashboardMessage', data.message || 'خطا در ارسال', 'error');
                }
            })
            .catch(error => {
                showMessage('dashboardMessage', 'خطای سرور: ' + error.message, 'error');
            });
        }

        function testConnection() {
            const testResultDiv = document.getElementById('testResult');
            testResultDiv.textContent = 'درحال تست...';
            testResultDiv.style.display = 'block';

            fetch('/test_connection')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        testResultDiv.className = 'message success';
                        testResultDiv.textContent = '✓ اتصال موفق: ' + data.message;
                    } else {
                        testResultDiv.className = 'message error';
                        testResultDiv.textContent = '✗ خطا: ' + data.message;
                    }
                })
                .catch(error => {
                    testResultDiv.className = 'message error';
                    testResultDiv.textContent = '✗ خطای سرور: ' + error.message;
                });
        }

        function scheduleSubmit() {
            const title = document.getElementById('scheduleTitle').value.trim();
            const description = document.getElementById('scheduleDescription').value.trim();
            const category = document.getElementById('scheduleCategory').value;
            const time = document.getElementById('scheduleTime').value.trim();

            if (!title || !description || !category || !time) {
                showMessage('dashboardMessage', 'لطفاً تمام فیلدها را پر کنید', 'error');
                return;
            }

            fetch('/schedule', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application
