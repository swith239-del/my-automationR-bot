<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ربات خودکار</title>
    <style>
        body { font-family: Arial; background: #667eea; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; }
        h1 { text-align: center; color: #333; }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        .btn-save { background: #667eea; color: white; }
        .btn-start { background: #4CAF50; color: white; }
        .btn-stop { background: #f44336; color: white; }
        button:hover { opacity: 0.9; }
        .status { margin-top: 20px; padding: 10px; border-radius: 5px; display: none; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 ربات خودکار</h1>
        
        <label>آدرس سایت *</label>
        <input type="url" id="siteUrl" placeholder="https://example.com">
        
        <label>نام کاربری *</label>
        <input type="text" id="username">
        
        <label>رمز عبور *</label>
        <input type="password" id="password">
        
        <label>توضیحات *</label>
        <textarea id="description" placeholder="متن توضیحی"></textarea>
        
        <button class="btn-save" onclick="saveConfig()">💾 ذخیره</button>
        <button class="btn-start" onclick="startAuto()">▶️ شروع</button>
        <button class="btn-stop" onclick="stopAuto()">⏹️ توقف</button>
        
        <div id="status" class="status"></div>
    </div>
    
    <script>
        function saveConfig() {
            fetch('/api/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    site_url: document.getElementById('siteUrl').value,
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value,
                    description: document.getElementById('description').value,
                    parameters: {}
                })
            })
            .then(r => r.json())
            .then(d => showStatus(d.message, 'success'))
            .catch(e => showStatus('❌ خطا', 'error'));
        }
        
        function startAuto() {
            fetch('/api/start', { method: 'POST' })
            .then(r => r.json())
            .then(d => showStatus(d.message, 'success'))
            .catch(e => showStatus('❌ خطا', 'error'));
        }
        
        function stopAuto() {
            fetch('/api/stop', { method: 'POST' })
            .then(r => r.json())
            .then(d => showStatus(d.message, 'success'))
            .catch(e => showStatus('❌ خطا', 'error'));
        }
        
        function showStatus(msg, type) {
            let s = document.getElementById('status');
            s.textContent = msg;
            s.style.display = 'block';
            s.style.background = type === 'success' ? '#d4edda' : '#f8d7da';
            s.style.color = type === 'success' ? '#155724' : '#721c24';
        }
    </script>
</body>
</html>
