<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خودکارسازی ارسال داده</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #333;
            text-align: center;
            font-size: 28px;
            margin-bottom: 30px;
        }
        
        #loginPage { display: block; }
        #dashboardPage { display: none; }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            color: white;
            width: 100%;
            margin-bottom: 10px;
        }
        
        .btn-primary {
            background: #667eea;
        }
        
        .btn-primary:hover {
            background: #5568d3;
        }
        
        .btn-success {
            background: #48bb78;
        }
        
        .btn-success:hover {
            background: #38a169;
        }
        
        .btn-info {
            background: #4299e1;
        }
        
        .btn-info:hover {
            background: #3182ce;
        }
        
        .btn-logout {
            background: #a0aec0;
        }
        
        .btn-logout:hover {
            background: #718096;
        }
        
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }
        
        .message.show { display: block; }
        
        .message.success {
            background: #c6f6d5;
            color: #22543d;
            border: 1px solid #9ae6b4;
        }
        
        .message.error {
            background: #fed7d7;
            color: #742a2a;
            border: 1px solid #fc8181;
        }
        
        .message.info {
            background: #bee3f8;
            color: #2c5282;
            border: 1px solid #90cdf4;
        }
        
        .status-box {
            background: #f8f9fa;
            border-right: 4px solid #667eea;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .status-item {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 14px;
        }
        
        .toggle-switch {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .switch {
            position: relative;
            width: 50px;
            height: 26px;
        }
        
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.3s;
            border-radius: 26px;
        }
        
        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }
        
        input:checked + .slider {
            background-color: #48bb78;
        }
        
        input:checked + .slider:before {
            transform: translateX(24px);
        }
        
        .welcome-text {
            background: #edf2f7;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #2d3748;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- صفحه ورود -->
        <div id="loginPage">
            <h1>🔐 ورود به سیستم</h1>
            <div id="loginMessage" class="message"></div>
            
            <div class="form-group">
                <label for="username">نام کاربری</label>
                <input type="text" id="username" placeholder="نام کاربری خود را وارد کنید">
            </div>
            
            <div class="form-group">
                <label for="password">رمز عبور</label>
                <input type="password" id="password" placeholder="رمز عبور خود را وارد کنید">
            </div>
            
            <button class="btn-primary" onclick="handleLogin()">ورود</button>
        </div>
        
        <!-- صفحه داشبورد -->
        <div id="dashboardPage">
            <h1>🤖 خودکارسازی ارسال داده</h1>
            
            <div class="welcome-text">
                👋 خوش آمدید <strong id="welcomeUsername"></strong>
            </div>
            
            <div id="dashboardMessage" class="message"></div>
            
            <div class="status-box">
                <div class="status-item">
                    <strong>وضعیت:</strong>
                    <span id="status-enabled">❌ غیرفعال</span>
                </div>
                <div class="status-item">
                    <strong>آخرین ارسال:</strong>
                    <span id="status-last-run">هنوز</span>
                </div>
                <div class="status-item">
                    <strong>پیام:</strong>
                    <span id="status-message">-</span>
                </div>
            </div>
            
            <div class="form-group">
                <label>فعال/غیرفعال کردن خودکار</label>
                <div class="toggle-switch">
                    <label class="switch">
                        <input type="checkbox" id="enableSwitch" onchange="updateToggleLabel()">
                        <span class="slider"></span>
                    </label>
                    <span id="toggleLabel">❌ غیرفعال</span>
                </div>
            </div>
            
            <div class="form-group">
                <label for="interval">فاصله زمانی (دقیقه)</label>
                <input type="number" id="interval" min="1" max="1440" value="60">
            </div>
            
            <div class="controls">
                <button class="btn-info" onclick="testConnection()">🧪 تست</button>
                <button class="btn-success" onclick="submitManual()">📤 ارسال</button>
                <button class="btn-primary" style="grid-column: span 2;" onclick="saveSchedule()">💾 ذخیره</button>
            </div>
            
            <button class="btn-logout" onclick="handleLogout()">🚪 خروج</button>
        </div>
    </div>

    <script>
        // بررسی ورود
        window.addEventListener('load', checkLogin);
        
        function checkLogin() {
            fetch('/api/dashboard')
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        showDashboard(data.username, data.status);
                    } else {
                        showLogin();
                    }
                })
                .catch(() => showLogin());
        }
        
        function showLogin() {
            document.getElementById('loginPage').style.display = 'block';
            document.getElementById('dashboardPage').style.display = 'none';
        }
        
        function showDashboard(username, status) {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('dashboardPage').style.display = 'block';
            document.getElementById('welcomeUsername').textContent = username;
            
            updateStatus(status);
        }
        
        function showMessage(msg, type, page = 'login') {
            const msgEl = document.getElementById(page + 'Message');
            msgEl.textContent = msg;
            msgEl.className = `message show ${type}`;
            setTimeout(() => msgEl.classList.remove('show'), 4000);
        }
        
        async function handleLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if (!username || !password) {
                showMessage('⚠️ تمام فیلدها الزامی هستند', 'error');
                return;
            }
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                
                if (data.success) {
                    showMessage(data.message, 'success');
                    setTimeout(() => checkLogin(), 1000);
                } else {
                    showMessage(data.message, 'error');
                }
            } catch (error) {
                showMessage(`❌ خطا: ${error.message}`, 'error');
            }
        }
        
        async function submitManual() {
            showMessage('📤 درحال ارسال...', 'info', 'dashboard');
            try {
                const response = await fetch('/api/submit', { method: 'POST' });
                const data = await response.json();
                
                if (data.success) {
                    showMessage(data.message, 'success', 'dashboard');
                    updateStatus(data.status);
                } else {
                    showMessage(data.message || '❌ خطا', 'error', 'dashboard');
                }
            } catch (error) {
                showMessage(`❌ خطا: ${error.message}`, 'error', 'dashboard');
            }
        }
        
        async function testConnection() {
            showMessage('🧪 درحال تست...', 'info', 'dashboard');
            try {
                const response = await fetch('/api/test', { method: 'POST' });
                const data = await response.json();
                
                showMessage(data.message, data.success ? 'success' : 'error', 'dashboard');
            } catch (error) {
                showMessage(`❌ خطا: ${error.message}`, 'error', 'dashboard');
            }
        }
        
        async function saveSchedule() {
            const enabled = document.getElementById('enableSwitch').checked;
            const interval = parseInt(document.getElementById('interval').value);
            
            showMessage('💾 درحال ذخیره...', 'info', 'dashboard');
            try {
                const response = await fetch('/api/schedule', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enabled, interval })
                });
                const data = await response.json();
                
                if (data.success) {
                    showMessage('✅ تنظیمات ذخیره شد', 'success', 'dashboard');
                    updateStatus(data.status);
                } else {
                    showMessage('❌ خطا در ذخیره', 'error', 'dashboard');
                }
            } catch (error) {
                showMessage(`❌ خطا: ${error.message}`, 'error', 'dashboard');
            }
        }
        
        function updateStatus(status) {
            document.getElementById('status-enabled').textContent = 
                status.enabled ? '✅ فعال' : '❌ غیرفعال';
            document.getElementById('status-last-run').textContent = 
                status.last_run || 'هنوز';
            document.getElementById('status-message').textContent = 
                status.message || '-';
            document.getElementById('enableSwitch').checked = status.enabled;
            updateToggleLabel();
        }
        
        function updateToggleLabel() {
            const label = document.getElementById('enableSwitch').checked ? '✅ فعال' : '❌ غیرفعال';
            document.getElementById('toggleLabel').textContent = label;
        }
        
        async function handleLogout() {
            await fetch('/api/logout', { method: 'POST' });
            showLogin();
        }
    </script>
</body>
</html>
