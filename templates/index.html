<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELOG Submission Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            margin-bottom: 5px;
            font-size: 28px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
        }

        .tab-btn {
            padding: 12px 24px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 16px;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-btn:hover {
            color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-success {
            background: #4caf50;
            color: white;
        }

        .btn-success:hover {
            background: #45a049;
        }

        .status-message {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .status-message.show {
            display: block;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status-message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .status-message.loading {
            background: #e7f3ff;
            color: #004085;
            border: 1px solid #b8daff;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .schedule-info {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
            border-left: 4px solid #667eea;
        }

        .schedule-info h4 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .schedule-item {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .schedule-item:last-child {
            border-bottom: none;
        }

        .schedule-item strong {
            color: #333;
        }

        .schedule-item .time {
            color: #999;
            font-size: 12px;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .status-indicator.connected {
            background: #4caf50;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }

        .status-indicator.disconnected {
            background: #f44336;
            box-shadow: 0 0 10px rgba(244, 67, 54, 0.5);
        }

        .status-indicator.checking {
            background: #ff9800;
            box-shadow: 0 0 10px rgba(255, 152, 0, 0.5);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
        }

        .modal.show {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
        }

        .modal-header {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }

        .modal-close {
            float: right;
            font-size: 28px;
            font-weight: bold;
            color: #999;
            cursor: pointer;
        }

        .modal-close:hover {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 ELOG Submission Dashboard</h1>
            <p>Automated Data Submission</p>
        </div>

        <div class="content">
            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('login')">🔑 Login</button>
                <button class="tab-btn" onclick="switchTab('submit')">📤 Submit</button>
                <button class="tab-btn" onclick="switchTab('schedule')">⏰ Schedule</button>
            </div>

            <!-- Login Tab -->
            <div id="login" class="tab-content active">
                <div id="loginStatus" class="status-message"></div>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter your username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password">
                </div>
                <button class="btn btn-primary" onclick="login()">Login</button>
            </div>

            <!-- Submit Tab -->
            <div id="submit" class="tab-content">
                <div id="submitStatus" class="status-message"></div>
                <div class="form-group">
                    <label for="dataType">Data Type</label>
                    <select id="dataType">
                        <option value="reading">Reading</option>
                        <option value="event">Event</option>
                        <option value="report">Report</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="deviceId">Device ID</label>
                        <input type="text" id="deviceId" placeholder="e.g., DEVICE-001">
                    </div>
                    <div class="form-group">
                        <label for="timestamp">Timestamp</label>
                        <input type="datetime-local" id="timestamp">
                    </div>
                </div>
                <div class="form-group">
                    <label for="dataValue">Data Value</label>
                    <input type="text" id="dataValue" placeholder="Enter value">
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" placeholder="Optional description..."></textarea>
                </div>
                <div class="button-group">
                    <button class="btn btn-primary" onclick="submitData()">Submit Now</button>
                    <button class="btn btn-secondary" onclick="clearSubmitForm()">Clear</button>
                </div>
            </div>

            <!-- Schedule Tab -->
            <div id="schedule" class="tab-content">
                <div id="scheduleStatus" class="status-message"></div>
                <div class="form-group">
                    <label for="scheduleInterval">Interval (minutes)</label>
                    <input type="number" id="scheduleInterval" min="1" max="1440" value="60" placeholder="60">
                </div>
                <div class="form-group">
                    <label for="scheduleData">Data to Submit (JSON)</label>
                    <textarea id="scheduleData" placeholder='{"dataType": "reading", "deviceId": "DEVICE-001", "dataValue": "25.5"}'></textarea>
                </div>
                <div class="button-group">
                    <button class="btn btn-success" onclick="startSchedule()">Start Schedule</button>
                    <button class="btn btn-secondary" onclick="stopSchedule()">Stop Schedule</button>
                </div>
                <div id="scheduleInfo" class="schedule-info" style="display:none;">
                    <h4>📋 Active Schedule</h4>
                    <div id="scheduleList"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        function showStatus(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.className = `status-message show ${type}`;
            setTimeout(() => {
                element.classList.remove('show');
            }, 5000);
        }

        function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) {
                showStatus('loginStatus', '❌ Please enter username and password', 'error');
                return;
            }

            showStatus('loginStatus', 'Logging in...', 'loading');

            fetch(`${API_BASE}/api/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    showStatus('loginStatus', '✅ ' + data.message, 'success');
                    setTimeout(() => switchTab('submit'), 1000);
                } else {
                    showStatus('loginStatus', '❌ ' + data.message, 'error');
                }
            })
            .catch(err => {
                showStatus('loginStatus', '❌ Error: ' + err.message, 'error');
            });
        }

        function submitData() {
            const dataType = document.getElementById('dataType').value;
            const deviceId = document.getElementById('deviceId').value.trim();
            const timestamp = document.getElementById('timestamp').value;
            const dataValue = document.getElementById('dataValue').value.trim();
            const description = document.getElementById('description').value.trim();

            if (!deviceId || !dataValue) {
                showStatus('submitStatus', '❌ Please fill in required fields', 'error');
                return;
            }

            const data = {
                dataType,
                deviceId,
                dataValue,
                description
            };

            if (timestamp) data.timestamp = timestamp;

            showStatus('submitStatus', 'Submitting...', 'loading');

            fetch(`${API_BASE}/api/submit`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(r => r.json())
            .then(d => {
                showStatus('submitStatus', (d.success ? '✅ ' : '❌ ') + d.message, d.success ? 'success' : 'error');
            })
            .catch(err => {
                showStatus('submitStatus', '❌ Error: ' + err.message, 'error');
            });
        }

        function clearSubmitForm() {
            document.getElementById('dataType').value = 'reading';
            document.getElementById('deviceId').value = '';
            document.getElementById('timestamp').value = '';
            document.
